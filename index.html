<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Custom Music Player</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .player-card {
      background-color: #1e1e1e;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      text-align: center;
      width: 320px;
    }
    input {
      width: 90%;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 6px;
      border: 1px solid #333;
      background: #2a2a2a;
      color: white;
    }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      background-color: #1db954;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background-color: #1ed760;
    }
    audio {
      margin-top: 20px;
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="player-card">
    <h2>Web Player</h2>
    <input type="text" id="audioUrl" placeholder="Paste Direct Audio MP3 URL...">
    <button onclick="playAudio()">Play</button>

    <audio id="audioStream" controls>
      Your browser does not support the audio tag.
    </audio>
  </div>

  <script>
    function playAudio() {
      const url = document.getElementById('audioUrl').value;
      const player = document.getElementById('audioStream');
      if (url) {
        player.src = url;
        player.play();
      }
    }
  </script>

</body>
</html>
